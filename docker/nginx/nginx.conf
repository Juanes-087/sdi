events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ocultar versión de Nginx por seguridad
    server_tokens off;

    # Timeouts y optimización
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Gzip para velocidad de carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ========================================================
    # 1. SERVIDOR PÚBLICO: Catálogo de Instrumentos (Puerto 80)
    # ========================================================
    server {
        listen 80;
        server_name localhost;

        # Bloquear acceso a archivos sensibles
        location ~* /\.(env|git|htaccess) {
            deny all;
            return 404;
        }

        # Bloquear acceso al módulo administrativo desde el puerto público
        location ^~ /html/InicioSesion.html {
            deny all;
            return 403;
        }
        location ^~ /html/menuPrincipal.php {
            deny all;
            return 403;
        }
        location ^~ /html/menuCliente.php {
            deny all;
            return 403;
        }
        location ^~ /src/php/validar.php {
            deny all;
            return 403;
        }
        location ^~ /src/php/registrar.php {
            deny all;
            return 403;
        }

        # Redirigir tráfico del catálogo público al contenedor de la aplicación
        location / {
            proxy_pass http://sdi-app:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ========================================================
    # 2. SERVIDOR PRIVADO: Panel Administrativo (Puerto 8443)
    # ========================================================
    server {
        listen 8443;
        server_name localhost;

        # Bloquear archivos de configuración
        location ~* /\.(env|git|htaccess) {
            deny all;
            return 404;
        }

        # Redirigir el inicio del panel admin a InicioSesion.html
        location = / {
            return 301 /html/InicioSesion.html;
        }

        # Redirigir al contenedor de la aplicación para operaciones administrativas
        location / {
            proxy_pass http://sdi-app:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

