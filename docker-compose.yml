services:
  # ============================================================================
  # 1. BASE DE DATOS: PostgreSQL 16
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: sdi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-db_specialized}
      POSTGRES_USER: ${DB_USER:-gr_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-specialized_secure_pwd_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts DDL y Carga inicial
      - ./docker/postgres/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./docker/postgres/init/02_load_functions.sh:/docker-entrypoint-initdb.d/02_load_functions.sh:ro
      - ./docker/postgres/init/03_data.sql:/docker-entrypoint-initdb.d/03_data.sql:ro
      # Carpeta fuente de funciones SQL completas
      - "./sistema/Front y Logica/sql:/docker-entrypoint-initdb.d/functions_source:ro"
    ports:
      # Enlazado únicamente a localhost/127.0.0.1 para pgAdmin / Mantenimiento seguro / DEJAR SOLO EN LOCAL QUITAR EN PRODUCCION
      # ports:
      #- "127.0.0.1:5432:5432" 
      # PARA PRODUCCION: Solo se puede acceder al puerto 5432 si estás conectado por SSH al servidor.
      # Esto hace que la base de datos sea inaccesible directamente desde internet, lo cual es una práctica de seguridad recomendada.
      
      - "54320:5432"
    networks:
      - sdi-internal-net
    command: >
      postgres
        -c shared_buffers=128MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c max_connections=50
        -c effective_cache_size=256MB

  # ============================================================================
  # 2. APLICACIÓN WEB / BACKEND: PHP 8.2 + Apache
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdi-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-db_specialized}
      DB_USER: ${DB_USER:-gr_admin}
      DB_PASSWORD: ${DB_PASSWORD:-specialized_secure_pwd_2026}
      JWT_SECRET: ${JWT_SECRET:-cambiar_por_clave_segura_minimo_32_caracteres_sdi_2026}
      APP_ENV: ${APP_ENV:-produccion}
      APP_DEBUG: ${APP_DEBUG:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-SPECIALIZED}
    volumes:
      - "./sistema/Front y Logica/images:/var/www/html/images"
    networks:
      - sdi-internal-net

  # ============================================================================
  # 3. REVERSE PROXY / SEGMENTACIÓN: Nginx
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: sdi-nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # EN PRODUCCIÓN EN LIGHTSAIL DESCOMENTA ESTA LÍNEA PARA QUE NGINX LEA LOS CERTIFICADOS:
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      # ========================================================================
      # CONFIGURACIÓN LOCAL (ACTIVA)
      # ========================================================================
      - "8085:80"     # Catálogo público
      - "8443:8443"   # Panel privado
      
      # ========================================================================
      # PARA PRODUCCIÓN EN LIGHTSAIL (USA ESTOS 3 PUERTOS):
      # ========================================================================
      # - "80:80"       # Redirige a HTTPS
      # - "443:443"     # HTTPS Candadito
      # - "8443:8443"   # Panel Privado
    networks:
      - sdi-internal-net

volumes:
  postgres_data:
    driver: local

networks:
  sdi-internal-net:
    driver: bridge
